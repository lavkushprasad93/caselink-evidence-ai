name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-validation:
    name: repository-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate ethics policy
        run: |
          grep -Fxq "Decision-support only." docs/ethics.md
          grep -Fxq "Synthetic data only until written authorization." docs/ethics.md
          grep -Fxq "No demographic features in scoring." docs/ethics.md
      - name: Ensure local environment file is not tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo ".env must not be committed"
            exit 1
          fi
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose -f infra/docker-compose.yml --env-file .env config --quiet
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API dependencies
        working-directory: apps/api
        run: python -m pip install -e ".[dev]"
      - name: Lint and test API
        working-directory: apps/api
        run: ruff check . && black --check . && mypy app && pytest
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install web dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Lint, test, and build web app
        working-directory: apps/web
        run: pnpm lint && pnpm test --run && pnpm build
