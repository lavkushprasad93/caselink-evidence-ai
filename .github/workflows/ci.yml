name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-validation:
    name: repository-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate ethics policy
        run: |
          grep -Fxq "Decision-support only." docs/ethics.md
          grep -Fxq "Synthetic data only until written authorization." docs/ethics.md
          grep -Fxq "No demographic features in scoring." docs/ethics.md
      - name: Ensure local environment file is not tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo ".env must not be committed"
            exit 1
          fi
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose -f infra/docker-compose.yml --env-file .env config --quiet
